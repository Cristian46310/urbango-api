spring.application.name=ms-security

spring.config.import=optional:file:.env[.properties],optional:file:./ms-security/.env[.properties]

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# DATABASE (MongoDB - ajusta si usas otra)
# ===============================
spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=${MONGO_DATABASE}

# ===============================
# GOOGLE OAUTH2 CONFIG
# ===============================
google.oauth2.client-id=${GOOGLE_CLIENT_ID}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:openid,profile,email}

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET}
# 1 hora en milisegundos
jwt.expiration=3600000 
auth.factor.length=6
# 5 minutos en milisegundos
auth.factor.expiration=300000 

# ===============================
# LOGGING (opcional pero útil)
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# EMAIL CONFIG
# ===============================
notifications.url = ${MS_NOTIFICATION_URL}

# ===============================
# GITHUB OAUTH CONFIG
# ===============================
github.oauth.client-id=${GITHUB_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:}
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:5173/auth/github/callback}
github.oauth.authorize-uri=https://github.com/login/oauth/authorize
github.oauth.token-uri=https://github.com/login/oauth/access_token
github.oauth.api-uri=https://api.github.com
github.oauth.state-expiration=600000
# RECAPTCHA CONFIG
# ===============================
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify
