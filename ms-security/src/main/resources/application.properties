spring.application.name=ms-security

spring.config.import=optional:file:.env[.properties],optional:file:./ms-security/.env[.properties]

spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:db_security}
server.port=${SERVER_PORT:8080}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
notifications.url=${NOTIFICATIONS_URL:http://127.0.0.1:8000/api/email/send}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:openid,profile,email}

