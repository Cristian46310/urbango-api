spring.application.name=ms-security

spring.config.import=optional:file:.env[.properties],optional:file:./ms-security/.env[.properties]

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# DATABASE (MongoDB - ajusta si usas otra)
# ===============================
spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=${MONGO_DATABASE}

# ===============================
# GOOGLE OAUTH2 CONFIG
# ===============================
google.oauth2.client-id=${GOOGLE_CLIENT_ID}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:openid,profile,email}

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET}
# 1 hora en milisegundos
jwt.expiration=3600000 
auth.factor.length=6
# 5 minutos en milisegundos
auth.factor.expiration=300000 

# ===============================
# LOGGING (opcional pero útil)
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# EMAIL CONFIG
# ===============================
notifications.url = ${MS_NOTIFICATION_URL}
password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}

# ===============================
# GITHUB OAUTH CONFIG
# ===============================
github.oauth.client-id=${GITHUB_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:}
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:5173/auth/github/callback}
github.oauth.authorize-uri=https://github.com/login/oauth/authorize
github.oauth.token-uri=https://github.com/login/oauth/access_token
github.oauth.api-uri=https://api.github.com
github.oauth.state-expiration=600000
# RECAPTCHA CONFIG
# ===============================
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# ===============================
# MICROSOFT OAUTH CONFIG
# ===============================
microsoft.oauth.client-id=${MICROSOFT_CLIENT_ID:}
microsoft.oauth.client-secret=${MICROSOFT_SECRET_KEY:}
microsoft.oauth.tenant-id=${MICROSOFT_TENANT_ID:common}
microsoft.oauth.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:5173/auth/microsoft/callback}
microsoft.oauth.authorize-uri=${MICROSOFT_AUTHORIZE_URI:https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize}
microsoft.oauth.token-uri=${MICROSOFT_TOKEN_URI:https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token}
microsoft.oauth.graph-uri=${MICROSOFT_GRAPH_URI:https://graph.microsoft.com}
microsoft.oauth.jwk-set-uri=${MICROSOFT_JWK_SET_URI:https://login.microsoftonline.com/{tenant}/discovery/v2.0/keys}
microsoft.oauth.scope=${MICROSOFT_SCOPE:openid profile email User.Read}
microsoft.oauth.state-expiration=600000