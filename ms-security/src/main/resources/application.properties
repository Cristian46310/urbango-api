spring.application.name=security

spring.config.import=optional:file:.env[.properties],optional:file:./ms-security/.env[.properties]

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# DATABASE (MongoDB - ajusta si usas otra)
# ===============================
spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=${MONGO_DATABASE}


# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET}
# 1 hora en milisegundos
jwt.expiration=3600000 
auth.factor.length=6
# 5 minutos en milisegundos
auth.factor.expiration=300000 

# ===============================
# LOGGING (opcional pero útil)
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# EMAIL CONFIG
# ===============================
notifications.url = ${MS_NOTIFICATION_URL}