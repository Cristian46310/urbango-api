# Test-only properties for CI and local runs without .env.
# Do not use real secrets here.

spring.config.import=

spring.datasource.url=jdbc:h2:mem:ms-security-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS security
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=security
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=ci-test-jwt-secret-minimum-32-characters-long
jwt.expiration=3600000
security.internal.key=ci-test-internal-key-minimum-32-chars
cors.allowed-origins=http://localhost:5173

google.oauth2.client-id=test-client-id
google.oauth2.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

notifications.url=http://127.0.0.1:8000/api/email/send

recaptcha.site-key=test-site-key
recaptcha.secret-key=test-secret-key

logging.level.org.springframework.security=WARN
