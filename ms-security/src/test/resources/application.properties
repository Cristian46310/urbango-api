# Test-only properties for CI and local runs without .env.
# Do not use real secrets here.

spring.config.import=

spring.mongodb.uri=mongodb://127.0.0.1:27017/ms-security-test
spring.mongodb.database=ms-security-test

jwt.secret=ci-test-jwt-secret-minimum-32-characters-long

google.oauth2.client-id=test-client-id
google.oauth2.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

notifications.url=http://127.0.0.1:8000/api/email/send

recaptcha.site-key=test-site-key
recaptcha.secret-key=test-secret-key

logging.level.org.springframework.security=WARN
