version: '3.8'

services:
  # Microservicio de Seguridad (PostgreSQL schema security)
  ms-security:
    build:
      context: ./ms-security
      dockerfile: DockerFile
    container_name: ms-security-app
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>=32 chars)}
      MS_SECURITY_INTERNAL_KEY: ${MS_SECURITY_INTERNAL_KEY}
      MS_NOTIFICATION_URL: ${MS_NOTIFICATION_URL:-http://ms-notifications:8000/api/email/send}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:3001}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:5173/auth/github/callback}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - backend-network

  # Microservicio de Notificaciones
  ms-notifications:
    build:
      context: ./ms-notifications
      dockerfile: Dockerfile
    container_name: ms-notifications-app
    ports:
      - "8000:8000"
    env_file:
      - ./ms-notifications/.env
    environment:
      PORT: 8000
      SECRETS_LOCATION: /run/secrets
    volumes:
      - ./ms-notifications/secrets:/run/secrets:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend-network

  # Microservicio de Mensajería (comparte Postgres con ms-business)
  ms-messages:
    build:
      context: ./ms-messages
      dockerfile: Dockerfile
    container_name: ms-messages-app
    ports:
      - "3001:3001"
    env_file:
      - ./ms-messages/.env
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_URL: ${DB_URL}
      MS_SECURITY_URL: ${MS_SECURITY_URL:-http://ms-security:8080}
      MS_SECURITY_INTERNAL_KEY: ${MS_SECURITY_INTERNAL_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    restart: unless-stopped
    depends_on:
      ms-security:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
