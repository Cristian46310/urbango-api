version: '3.8'

services:
  # Microservicio de Seguridad
  ms-security:
    build:
      context: ./ms-security
      dockerfile: DockerFile
    container_name: ms-security-app
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI}
      SPRING_MONGODB_DATABASE: ${SPRING_MONGODB_DATABASE:-backend-jmmg}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-fbc}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    
    # Reinicio automático
    restart: unless-stopped
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    networks:
      - backend-network

  # Microservicio de Notificaciones
  ms-notifications:
    build:
      context: ./ms-notifications
      dockerfile: Dockerfile
    container_name: ms-notifications-app
    ports:
      - "8000:8000"
    env_file:
      - ./ms-notifications/.env
    environment:
      PORT: 8000
      SECRETS_LOCATION: /run/secrets
    volumes:
      - ./ms-notifications/secrets:/run/secrets:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend-network

  # MongoDB local para desarrollo (opcional)
  # Descomenta si quieres usar MongoDB local en lugar de Atlas
  # mongodb:
  #   image: mongo:7.0-alpine
  #   container_name: mongodb-dev
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
  #     MONGO_INITDB_DATABASE: backend-jmmg
  #   volumes:
  #     - mongodb_data:/data/db
  #     - mongodb_config:/data/configdb
  #   restart: unless-stopped
  #   networks:
  #     - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
