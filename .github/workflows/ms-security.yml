name: MS Security

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Build
        run: mvn clean verify
        working-directory: ./ms-security

      - name: Run SonarQube Analysis (opcional)
        run: mvn sonar:sonar
        working-directory: ./ms-security
        if: github.event_name == 'push'